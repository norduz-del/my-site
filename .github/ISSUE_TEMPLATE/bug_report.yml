name: Reportar un error
description: Describe un comportamiento inesperado del sitio o del repositorio.
title: "[Error]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué ocurrió?
      description: Describe el comportamiento observado.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre...
        2. Selecciona...
        3. Observa...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ¿Qué esperabas que ocurriera?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Navegador, dispositivo o versión relevante. No incluyas información privada.
    validations:
      required: false
